version: "3.8"
services:
  backend:
    build:
      context: ./be
    expose:
      - "18080"
    volumes:
      - ./be/uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:18080/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    container_name: ui-testgen-be
    restart: unless-stopped

  frontend:
    build:
      context: ./fe
    ports:
      - "3030:80"
    depends_on:
      backend:
        condition: service_healthy
    container_name: ui-testgen-fe
    restart: unless-stopped
