version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: testgen_db
    environment:
      POSTGRES_USER: testgen_user
      POSTGRES_PASSWORD: testgen_password
      POSTGRES_DB: testgen_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen_user -d testgen_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: testgen_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: testgen_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # This is a setup container to create the default bucket in minio
  minio-setup:
    image: minio/mc
    container_name: testgen_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add testgen_minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb testgen_minio/ui-testgen-local || true;
      /usr/bin/mc anonymous set public testgen_minio/ui-testgen-local;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
